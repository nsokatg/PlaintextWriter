<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ＰｌａｉｎｔｅｘｔＷｒｉｔｅｒ</title>
<style>
:root{--bg:#f6f5f1;--pane:#fffefb;--ink:#26292b;--sub:#6b7074;--line:#d9d6cc;--accent:#1f6f6b;--accent-ink:#fff;--warn:#b4532a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d1e;--pane:#232627;--ink:#e6e4de;--sub:#9a9fa3;--line:#3a3e40;--accent:#5bb5af;--accent-ink:#0f1e1d;--warn:#e08a5e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1d1e;--pane:#232627;--ink:#e6e4de;--sub:#9a9fa3;--line:#3a3e40;--accent:#5bb5af;--accent-ink:#0f1e1d;--warn:#e08a5e;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.25rem;margin:0 0 4px;font-weight:700}
p.lead{margin:0 0 16px;color:var(--sub);font-size:.9rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:4px 16px;margin:0 0 14px;padding:12px 14px;background:var(--pane);border:1px solid var(--line);border-radius:6px}
.opts label{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;cursor:pointer}
.opts input{margin-top:.35em;accent-color:var(--accent)}
textarea{width:100%;height:min(52vh,460px);min-height:240px;resize:vertical;padding:14px;font:inherit;line-height:1.7;color:var(--ink);background:var(--pane);border:1px solid var(--line);border-radius:6px}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
button{font:inherit;font-size:.92rem;padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:var(--pane);color:var(--ink);cursor:pointer}
button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.45;cursor:default}
.stat{margin-left:auto;font-size:.85rem;color:var(--sub);text-align:right}
.stat b{color:var(--warn)}
#msg{min-height:1.5em;margin-top:8px;font-size:.88rem;color:var(--accent)}
.note{margin-top:2px;font-size:.8rem;color:var(--sub)}
</style>
</head>
<body>
<main>
<h1>ＰｌａｉｎｔｅｘｔＷｒｉｔｅｒ</h1>
<p class="lead">貼り付けると、見えない文字や余分な改行を自動で取り除きます。整形後にコピーして使ってください。</p>

<div class="opts">
<label><input type="checkbox" id="o_invis" checked>見えない文字を削除（ゼロ幅文字・BOM・制御文字など）</label>
<label><input type="checkbox" id="o_space" checked>特殊な空白（全角・NBSPなど）を半角スペースに</label>
<label><input type="checkbox" id="o_trail" checked>行末の空白を削除</label>
<label><input type="checkbox" id="o_blank" checked>連続する空行を1つにまとめる</label>
<label><input type="checkbox" id="o_multi">連続する半角スペースを1つにまとめる</label>
<label><input type="checkbox" id="o_join">文中の改行をつなげる（PDF向け・空行は段落として残す）</label>
<label><input type="checkbox" id="o_auto" checked>貼り付け時に自動で整形する</label>
</div>

<textarea id="t" placeholder="ここにテキストを貼り付けてください" spellcheck="false" aria-label="テキスト入力"></textarea>

<div class="bar">
<button class="main" id="clean">整形する</button>
<button id="copy">コピー</button>
<button id="undo" disabled>元に戻す</button>
<button id="clear">クリア</button>
<button id="open">開く（.txt）</button>
<button id="save">保存（.txt）</button>
<input type="file" id="file" accept=".txt,text/plain" hidden>
<div class="stat" id="stat"></div>
</div>
<div id="msg" role="status" aria-live="polite"></div>
<div id="auto" class="note"></div>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var t=$('t'),msg=$('msg'),stat=$('stat'),undoBtn=$('undo');
  var historyState = null;
  var KEY='plain-text-memo:v1',timer=null,autoEl=$('auto');

  function persist(){
    clearTimeout(timer);
    try{localStorage.setItem(KEY,t.value)}
    catch(e){autoEl.textContent='自動保存できません（ブラウザの保存が無効か容量不足です）。必要な内容は「保存（.txt）」で残してください。'}
  }
  function schedule(){clearTimeout(timer);timer=setTimeout(persist,300)}
  try{
    var saved=localStorage.getItem(KEY);
    if(saved) t.value=saved;
    autoEl.textContent='入力内容はこのブラウザに自動保存されます。';
  }catch(e){
    autoEl.textContent='自動保存できません（ブラウザの保存が無効です）。必要な内容は「保存（.txt）」で残してください。';
  }
  window.addEventListener('pagehide',persist);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')persist()});
  
  var INVIS=/[\u200B-\u200F\u202A-\u202E\u2060-\u2064\u2066-\u206F\uFEFF\u00AD\u180E\u034F\uFFF9-\uFFFC]/g;
  var CTRL=/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F]/g;
  var SPACES=/[\u00A0\u1680\u2000-\u200A\u202F\u205F\u3000]/g;
  var EMOJI_END=/(?:[\uD83C-\uDBFF][\uDC00-\uDFFF]|[\u2190-\u2BFF\uFE0F])$/;

  function clean(s,keepEdge){
    var r={invis:0,space:0};
    s=s.replace(/\r\n?/g,'\n').replace(/[\u2028\u2029\u0085]/g,'\n');
    if($('o_invis').checked){
      s=s.replace(INVIS,function(m,off,str){if(m==='\u200D'&&EMOJI_END.test(str.slice(Math.max(0,off-2),off)))return m;r.invis++;return''}).replace(CTRL,function(){r.invis++;return''});
    }
    if($('o_space').checked){
      s=s.replace(SPACES,function(){r.space++;return' '}).replace(/\t/g,' ');
    }
    if($('o_trail').checked) s=s.replace(/[ \t\u00A0\u3000]+$/gm,'');
    if($('o_join').checked){
      s=s.replace(/([^\n])\n(?=([^\n]))/g,function(m,a,b){
        return (/[A-Za-z0-9,.;:)]$/.test(a)&&/^[A-Za-z0-9(]/.test(b))?a+' ':a;
      });
    }
    if($('o_multi').checked) s=s.replace(/ {2,}/g,' ');
    if($('o_blank').checked) s=s.replace(/\n{3,}/g,'\n\n');
    return {text:keepEdge?s:s.replace(/^\n+|\n+$/g,''),r:r};
  }

  function show(r){
    var n=Array.from(t.value).length;
    stat.innerHTML='文字数 '+n+(r?' / 削除した不可視文字 <b>'+r.invis+'</b> 空白変換 '+r.space:'');
  }

  function saveHistory(){
    historyState = t.value;
    undoBtn.disabled = false;
  }

  $('clean').onclick=function(){
    if(!t.value) return;
    saveHistory();
    var o=clean(t.value);
    t.value=o.text;
    show(o.r);
    persist();
    msg.textContent='整形しました。';
  };

  t.addEventListener('paste',function(e){
    if(!$('o_auto').checked) return;
    var cd=e.clipboardData||window.clipboardData;
    if(!cd) return;
    var txt=cd.getData('text/plain');
    if(!txt) return;
    e.preventDefault();
    
    saveHistory();
    var o=clean(txt,true),s=t.selectionStart,en=t.selectionEnd;
    t.value=t.value.slice(0,s)+o.text+t.value.slice(en);
    var p=s+o.text.length;
    t.setSelectionRange(p,p);
    show(o.r);
    persist();
    msg.textContent='貼り付け時に整形しました。';
  });

  t.addEventListener('input',function(){
    show(null);
    msg.textContent='';
    schedule();
  });

  $('copy').onclick=function(){
    var v=t.value;
    function ok(){msg.textContent='コピーしました。'}
    function fallback(){
      t.focus();
      t.select();
      t.setSelectionRange(0,t.value.length);
      var done=false;
      try{done=document.execCommand('copy')}catch(e){}
      if(done) ok();
      else msg.textContent='コピーできませんでした。手動で選択してコピーしてください。';
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(v).then(ok,fallback);
    }else{
      fallback();
    }
  };

  undoBtn.onclick=function(){
    if(historyState===null) return;
    var current = t.value;
    t.value = historyState;
    historyState = current; 
    show(null);
    persist();
    msg.textContent='元に戻しました。';
  };

  $('clear').onclick=function(){
    if(!t.value) return;
    saveHistory();
    t.value='';
    show(null);
    persist();
    msg.textContent='クリアしました。';
    t.focus();
  };

  $('save').onclick=function(){
    if(!t.value){msg.textContent='保存する内容がありません。';return}
    var d=new Date(),z=function(n){return (n<10?'0':'')+n};
    var name='memo-'+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'-'+z(d.getHours())+z(d.getMinutes())+'.txt';
    var url=URL.createObjectURL(new Blob([t.value],{type:'text/plain;charset=utf-8'}));
    var a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1000);
    msg.textContent='「'+name+'」として保存しました（ダウンロード先を確認してください）。';
  };

  $('open').onclick=function(){$('file').click()};
  $('file').onchange=function(){
    var input=this,f=input.files&&input.files[0];
    if(!f) return;
    if(f.size>10*1024*1024){msg.textContent='ファイルが大きすぎます（10MBまで）。';input.value='';return}
    f.arrayBuffer().then(function(buf){
      var txt,enc='UTF-8';
      try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}
      catch(e){
        try{txt=new TextDecoder('shift_jis').decode(buf);enc='Shift_JIS'}
        catch(e2){msg.textContent='読み込めませんでした。';return}
      }
      txt=txt.replace(/\r\n?/g,'\n');
      saveHistory();
      t.value=txt;
      persist();
      show(null);
      msg.textContent='「'+f.name+'」を読み込みました（'+enc+'）。「元に戻す」で読み込み前の内容に戻せます。';
    },function(){msg.textContent='読み込めませんでした。'});
    input.value='';
  };

  show(null);
})();
</script>
</body>
</html>
